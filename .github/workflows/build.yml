name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel  # arm64 Mac runners are often queued for a long time; output is universal anyway
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: make test
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build universal app + package
        run: make dist VERSION=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: AmaderBanglaKeyboard-${{ steps.v.outputs.version }}
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Amader Bangla Keyboard ${{ steps.v.outputs.version }} for macOS" \
            --notes-file docs/RELEASE_NOTES.md
